<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企业共享图书馆 · 联网版</title>
  <script src="https://cdn.bootcdn.net/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/turn.js/3/turn.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft Yahei", "PingFang SC", sans-serif; }
    body { background: #f5f7fa; min-height: 100vh; }
    .hidden { display: none !important; }
    
    /* 导航栏 */
    .navbar { background: white; box-shadow: 0 2px 12px rgba(0,0,0,0.08); position: sticky; top: 0; z-index: 100; }
    .nav-inner { max-width: 1200px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .logo { font-size: 22px; font-weight: bold; color: #1D2129; }
    .sync-badge { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; }
    .sync-online { background: #E8FFEA; color: #00B42A; }
    .sync-syncing { background: #FFF7E6; color: #FF7D00; }
    .sync-offline { background: #FFECE8; color: #F53F3F; }
    
    /* 主布局 */
    .main-layout { max-width: 1200px; margin: 0 auto; padding: 24px 20px; display: flex; gap: 24px; }
    .sidebar { width: 180px; flex-shrink: 0; }
    .sidebar-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); position: sticky; top: 80px; }
    .sidebar-title { font-weight: 600; color: #1D2129; margin-bottom: 16px; font-size: 16px; }
    .cat-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
    .cat-btn { width: 100%; text-align: left; border: none; background: none; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: all 0.2s; color: #4E5969; }
    .cat-btn:hover { background: #F2F3F5; }
    .cat-btn.active { background: #E8F3FF; color: #165DFF; font-weight: 600; }
    
    /* 内容区 */
    .content-area { flex: 1; min-width: 0; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .section-title { font-size: 24px; font-weight: 600; color: #1D2129; }
    
    /* 书籍网格 */
    .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .book-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: all 0.3s ease; cursor: pointer; }
    .book-card:hover { transform: translateY(-6px); box-shadow: 0 12px 24px rgba(0,0,0,0.12); }
    .book-cover-img { width: 100%; height: 200px; object-fit: cover; border-bottom: 1px solid #F2F3F5; }
    .book-details { padding: 16px; }
    .book-name { font-size: 16px; font-weight: 600; color: #1D2129; margin-bottom: 4px; }
    .book-meta { color: #4E5969; font-size: 13px; margin-bottom: 6px; }
    .book-desc { color: #4E5969; font-size: 13px; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    
    /* 按钮 */
    .btn { padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-primary { background: #165DFF; color: white; } .btn-primary:hover { background: #0E42D2; }
    .btn-success { background: #00B42A; color: white; } .btn-success:hover { background: #009E24; }
    .btn-warning { background: #FF7D00; color: white; } .btn-warning:hover { background: #E67000; }
    .btn-danger { background: #F53F3F; color: white; } .btn-danger:hover { background: #D93636; }
    .btn-outline { background: white; border: 2px solid #165DFF; color: #165DFF; } .btn-outline:hover { background: #E8F3FF; }
    .btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 6px; }
    
    /* 状态标签 */
    .badge { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; }
    .badge-pending { background: #FFF7E6; color: #FF7D00; }
    .badge-published { background: #E8FFEA; color: #00B42A; }
    .badge-unpublished { background: #F2F3F5; color: #86909C; }
    
    /* 模态框 */
    .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 999; display: flex; align-items: center; justify-content: center; }
    .modal-box { background: white; border-radius: 16px; padding: 24px; max-width: 900px; width: 95%; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-close { background: none; border: none; font-size: 28px; cursor: pointer; color: #86909C; }
    
    /* 翻书效果 */
    .book-container { width: 800px; height: 500px; margin: 0 auto; }
    .book-page { width: 400px; height: 500px; background: #fff; box-shadow: inset 0 0 20px rgba(0,0,0,0.04); }
    .page-content { padding: 40px; height: 100%; overflow-y: auto; }
    .page-content h2 { margin-bottom: 20px; color: #1D2129; }
    .page-content p { line-height: 2; margin-bottom: 1em; text-indent: 2em; color: #4E5969; }
    .cover-page { display: table-cell; vertical-align: middle; text-align: center; background: linear-gradient(135deg, #667eea, #764ba2); color: white; width: 400px; height: 500px; }
    .cover-page img { width: 150px; height: 200px; border-radius: 12px; margin-bottom: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); object-fit: cover; }
    
    /* 搜索框 */
    .search-box { border: 2px solid #E5E6EB; border-radius: 8px; padding: 8px 14px; width: 200px; font-size: 14px; }
    .search-box:focus { outline: none; border-color: #165DFF; }
    
    /* 管理表格 */
    .admin-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .admin-table th { padding: 12px; text-align: left; color: #4E5969; font-weight: 500; background: #F7F8FA; border-bottom: 2px solid #E5E6EB; }
    .admin-table td { padding: 12px; border-bottom: 1px solid #F2F3F5; }
    
    @media (max-width: 768px) {
      .main-layout { flex-direction: column; }
      .sidebar { width: 100%; }
      .sidebar-card { position: static; }
      .book-container { width: 100%; height: 300px; }
      .book-page { width: 50%; height: 300px; }
    }
  </style>
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="nav-inner">
      <div class="logo">📚 企业共享图书馆</div>
      <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
        <span id="syncBadge" class="sync-badge sync-online">🟢 已连接</span>
        <input id="searchInput" class="search-box" type="text" placeholder="🔍 搜索..." onkeypress="if(event.key==='Enter')doSearch()">
        <button onclick="shareBook()" class="btn btn-outline">📤 分享书籍</button>
        <button onclick="exportData()" class="btn btn-outline">💾 导出</button>
        <button onclick="importData()" class="btn btn-outline">📥 导入</button>
        <button id="adminBtn" class="btn btn-outline">🔑 管理员</button>
      </div>
    </div>
  </nav>

  <!-- 主布局 -->
  <div class="main-layout">
    <aside class="sidebar">
      <div class="sidebar-card">
        <div class="sidebar-title">📂 分类导航</div>
        <ul id="categoryNav" class="cat-list"></ul>
      </div>
    </aside>

    <main class="content-area">
      <div id="userView">
        <div class="section-header">
          <h2 id="listTitle" class="section-title">所有书籍</h2>
          <span id="bookCount" style="color:#86909C;"></span>
        </div>
        <div id="booksGrid" class="books-grid"></div>
      </div>

      <div id="adminView" class="hidden">
        <div class="section-header">
          <h2 class="section-title">📋 书籍管理</h2>
          <button onclick="syncNow()" class="btn btn-primary">🔄 刷新同步</button>
        </div>
        <div style="background:white; border-radius:12px; overflow:auto; box-shadow:0 2px 8px rgba(0,0,0,0.06);">
          <table class="admin-table">
            <thead><tr><th>封面</th><th>书名</th><th>作者</th><th>分类</th><th>状态</th><th>操作</th></tr></thead>
            <tbody id="adminTableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- 阅读模态框 -->
  <div id="readModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="readBookTitle">📖 阅读中...</h3>
        <button class="modal-close" onclick="closeReadModal()">&times;</button>
      </div>
      <div id="bookWrapper"><div id="flipbook" class="book-container"></div></div>
      <div style="display:flex; justify-content:center; align-items:center; gap:20px; margin-top:16px;">
        <button onclick="$('#flipbook').turn('previous')" class="btn btn-outline">◀ 上一页</button>
        <span id="pageIndicator" style="color:#86909C;">1 / 1</span>
        <button onclick="$('#flipbook').turn('next')" class="btn btn-outline">下一页 ▶</button>
      </div>
    </div>
  </div>

  <script>
    // ==================== 配置（已填入您的信息） ====================
    const JSONBIN_API_KEY = '$2a$10$91/hbGCAIvpff7z7yYL4l.sJTo/c1rRodKQGhFJWnJPXttzpSZvXa';
    const JSONBIN_BIN_ID = '69eec66a36566621a8f5cfda';
    
    // ==================== 全局状态 ====================
    let books = [];
    let categoryMap = {};
    let adminPassword = 'admin123';
    let isAdmin = false;
    let currentCategory = 'all';
    let isSyncing = false;

    // ==================== 云端同步 ====================
    function updateSyncBadge(status) {
      const badge = document.getElementById('syncBadge');
      if (status === 'online') { badge.className = 'sync-badge sync-online'; badge.textContent = '🟢 已连接'; }
      else if (status === 'syncing') { badge.className = 'sync-badge sync-syncing'; badge.textContent = '🟡 同步中...'; }
      else { badge.className = 'sync-badge sync-offline'; badge.textContent = '🔴 离线'; }
    }

    async function loadFromCloud() {
      if (isSyncing) return;
      isSyncing = true;
      updateSyncBadge('syncing');
      
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
          headers: { 'X-Master-Key': JSONBIN_API_KEY }
        });
        
        if (res.ok) {
          const data = await res.json();
          const record = data.record;
          books = record.books || [];
          categoryMap = record.categoryMap || {};
          adminPassword = record.adminPassword || 'admin123';
          updateSyncBadge('online');
        }
      } catch (e) {
        console.error('同步失败:', e);
        updateSyncBadge('offline');
      } finally {
        isSyncing = false;
        renderAll();
      }
    }

    async function saveToCloud() {
      if (isSyncing) return;
      isSyncing = true;
      updateSyncBadge('syncing');
      
      try {
        await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': JSONBIN_API_KEY
          },
          body: JSON.stringify({ books, categoryMap, adminPassword })
        });
        updateSyncBadge('online');
      } catch (e) {
        console.error('保存失败:', e);
        updateSyncBadge('offline');
      } finally {
        isSyncing = false;
      }
    }

    function syncNow() { loadFromCloud().then(() => alert('同步完成！')); }
    setInterval(() => loadFromCloud(), 10000); // 每10秒自动同步

    // ==================== 导出/导入 ====================
    function exportData() {
      const data = JSON.stringify({ books, categoryMap, adminPassword }, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `图书馆备份_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    function importData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (confirm('导入将覆盖当前数据，确定继续？')) {
              books = data.books || [];
              categoryMap = data.categoryMap || {};
              adminPassword = data.adminPassword || 'admin123';
              saveToCloud();
              renderAll();
              alert('导入成功！');
            }
          } catch (err) { alert('文件格式错误'); }
        };
        reader.readAsText(e.target.files[0]);
      };
      input.click();
    }

    // ==================== 渲染 ====================
    function renderAll() {
      renderCategoryNav();
      renderBooks();
      if (isAdmin) renderAdminTable();
      
      document.getElementById('userView').classList.toggle('hidden', isAdmin);
      document.getElementById('adminView').classList.toggle('hidden', !isAdmin);
      document.getElementById('adminBtn').textContent = isAdmin ? '退出管理' : '🔑 管理员';
    }

    function renderCategoryNav() {
      const nav = document.getElementById('categoryNav');
      const cats = [
        { key: 'all', label: '📖 所有书籍' },
        { key: 'tech', label: '💻 技术类' },
        { key: 'manage', label: '📊 管理类' },
        { key: 'literature', label: '📜 文学类' },
        { key: 'psychology', label: '🧠 心理学' },
        { key: 'career', label: '💼 职场类' }
      ];
      if (isAdmin) cats.push({ key: 'pending', label: '⏳ 待审核' });
      
      nav.innerHTML = cats.map(c => 
        `<li><button class="cat-btn ${currentCategory === c.key ? 'active' : ''}" 
          data-cat="${c.key}">${c.label}</button></li>`
      ).join('');
      
      nav.querySelectorAll('.cat-btn').forEach(btn => {
        btn.onclick = () => {
          nav.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentCategory = btn.dataset.cat;
          renderBooks();
        };
      });
    }

    function renderBooks() {
      document.getElementById('listTitle').textContent = 
        currentCategory === 'all' ? '所有书籍' : 
        currentCategory === 'pending' ? '待审核书籍' : 
        categoryMap[currentCategory] || currentCategory;
      
      let filtered = [...books];
      if (currentCategory === 'pending') filtered = books.filter(b => b.status === 0);
      else if (currentCategory !== 'all') filtered = books.filter(b => b.category === currentCategory);
      if (!isAdmin) filtered = filtered.filter(b => b.status === 1);
      
      const search = document.getElementById('searchInput').value.toLowerCase();
      if (search) filtered = filtered.filter(b => 
        (b.name || '').toLowerCase().includes(search) || 
        (b.author || '').toLowerCase().includes(search)
      );
      
      document.getElementById('bookCount').textContent = `共 ${filtered.length} 本`;
      
      const grid = document.getElementById('booksGrid');
      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;color:#86909C;">📭 暂无书籍</div>';
        return;
      }
      
      grid.innerHTML = filtered.map(book => `
        <div class="book-card" onclick="openReadModal(${book.id})">
          <img class="book-cover-img" src="${book.cover}" alt="${book.name}" 
            onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22200%22><rect fill=%22%23E5E6EB%22 width=%22300%22 height=%22200%22/><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 fill=%22%2386909C%22 font-size=%2248%22>📖</text></svg>'">
          <div class="book-details">
            <div class="book-name">${book.name}</div>
            <div class="book-meta">✍️ ${book.author} · 👤 ${book.uploader}</div>
            <div class="book-desc">${book.review || '暂无简介'}</div>
            ${book.status === 0 ? '<span class="badge badge-pending">待审核</span>' : ''}
          </div>
        </div>
      `).join('');
    }

    function renderAdminTable() {
      document.getElementById('adminTableBody').innerHTML = books.map(book => `
        <tr>
          <td><img src="${book.cover}" style="width:40px;height:55px;object-fit:cover;border-radius:4px;" 
            onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2255%22><rect fill=%22%23E5E6EB%22 width=%2240%22 height=%2255%22/></svg>'"></td>
          <td><strong>${book.name}</strong></td>
          <td>${book.author}</td>
          <td>${categoryMap[book.category] || book.category}</td>
          <td><span class="badge ${book.status===0?'badge-pending':book.status===1?'badge-published':'badge-unpublished'}">
            ${['待审核','已上架','已下架'][book.status]}</span></td>
          <td>
            ${book.status===0?`<button onclick="approve(${book.id})" class="btn btn-sm btn-success">通过</button>
              <button onclick="reject(${book.id})" class="btn btn-sm btn-warning">拒绝</button>`:''}
            ${book.status===1?`<button onclick="unpublish(${book.id})" class="btn btn-sm btn-warning">下架</button>`:''}
            ${book.status===2?`<button onclick="publish(${book.id})" class="btn btn-sm btn-success">上架</button>`:''}
            <button onclick="removeBook(${book.id})" class="btn btn-sm btn-danger">删除</button>
          </td>
        </tr>
      `).join('');
    }

    // ==================== 操作 ====================
    function approve(id) { updateStatus(id, 1); }
    function reject(id) { updateStatus(id, 2); }
    function unpublish(id) { updateStatus(id, 2); }
    function publish(id) { updateStatus(id, 1); }
    
    function updateStatus(id, status) {
      const book = books.find(b => b.id === id);
      if (book) { book.status = status; saveToCloud(); renderAll(); }
    }
    
    function removeBook(id) {
      if (confirm('确认删除？')) { books = books.filter(b => b.id !== id); saveToCloud(); renderAll(); }
    }

    function shareBook() {
      const name = prompt('📖 书名：');
      if (!name) return;
      const author = prompt('✍️ 作者：');
      const uploader = prompt('👤 您的名字：');
      const review = prompt('💬 简介：') || '';
      
      books.push({
        id: Date.now(), name, author: author || '未知',
        cover: 'https://img.alicdn.com/imgextra/i3/2201317573534/O1CN01TjZQxr1rLHYZ2KUZf_!!2201317573534.jpg_430x430q90.jpg',
        uploader: uploader || '匿名', review, category: 'tech', status: 0,
        uploadDate: new Date().toISOString().slice(0, 10),
        pages: ['<div class="page-content"><h2>内容</h2><p>' + (review || '待补充') + '</p></div>']
      });
      
      saveToCloud();
      renderAll();
      alert('✅ 分享成功！等待管理员审核。');
    }

    function openReadModal(bookId) {
      const book = books.find(b => b.id === bookId);
      if (!book) return;
      
      document.getElementById('readBookTitle').textContent = `📖 ${book.name}`;
      const container = document.getElementById('flipbook');
      container.innerHTML = '';
      
      const cover = document.createElement('div');
      cover.className = 'book-page cover-page';
      cover.innerHTML = `<img src="${book.cover}" alt="${book.name}"><h2>${book.name}</h2><p>${book.author} · ${book.uploader}</p>`;
      container.appendChild(cover);
      
      book.pages.forEach(page => {
        const div = document.createElement('div');
        div.className = 'book-page';
        div.innerHTML = page;
        container.appendChild(div);
      });
      
      try {
        $('#flipbook').turn({
          width: 800, height: 500, display: 'double', autoCenter: true,
          when: { turned: (e, page) => {
            document.getElementById('pageIndicator').textContent = `${page} / ${$('#flipbook').turn('pages')}`;
          }}
        });
        $('#flipbook').turn('page', 1);
        document.getElementById('pageIndicator').textContent = `1 / ${$('#flipbook').turn('pages')}`;
      } catch(e) {
        document.getElementById('pageIndicator').textContent = `共 ${book.pages.length + 1} 页`;
      }
      
      document.getElementById('readModal').classList.remove('hidden');
    }

    function closeReadModal() {
      try { $('#flipbook').turn('destroy'); } catch(e) {}
      document.getElementById('readModal').classList.add('hidden');
    }

    function doSearch() { renderBooks(); }

    // ==================== 管理员登录 ====================
    document.getElementById('adminBtn').onclick = () => {
      if (isAdmin) {
        isAdmin = false;
        currentCategory = 'all';
        renderAll();
      } else {
        const pwd = prompt('请输入管理员密码：');
        if (pwd === adminPassword) {
          isAdmin = true;
          renderAll();
          alert('✅ 已进入管理模式');
        } else if (pwd) {
          alert('❌ 密码错误');
        }
      }
    };

    document.getElementById('readModal').onclick = function(e) {
      if (e.target === this) closeReadModal();
    };

    // ==================== 启动 ====================
    loadFromCloud().then(() => renderAll());
  </script>
</body>
</html>
